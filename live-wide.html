<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente de reunión</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/live/live.css" />
    <link rel="stylesheet" href="/src/live/wide.css" />
  </head>
  <body>
    <div id="wide" class="wide">
      <header class="wide-bar" id="wide-bar" data-tauri-drag-region></header>
      <div class="wide-columns" id="wide-columns">
        <aside class="wide-questions" id="wide-questions" aria-label="Preguntas"></aside>
        <main class="wide-answer" id="wide-answer"></main>
        <aside class="wide-transcript" id="wide-transcript" aria-label="Transcripción en vivo"></aside>
        <div class="sash sash--questions" id="sash-questions" role="separator" aria-orientation="vertical" aria-label="Ancho de las preguntas" tabindex="0"></div>
        <div class="sash sash--transcript" id="sash-transcript" role="separator" aria-orientation="vertical" aria-label="Ancho de la transcripción" tabindex="0"></div>
      </div>
    </div>
    <script type="module" src="/src/live-wide.ts"></script>
  </body>
</html>
