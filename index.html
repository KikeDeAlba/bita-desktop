<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bita</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="panel">
      <header class="bar">
        <span class="bar-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="8" cy="9" r="5.4" />
            <path d="M8 6.3V9l1.8 1.1M6.2 1.9h3.6" />
          </svg>
        </span>
        <span class="bar-wordmark">bita</span>
        <span class="bar-label">Hoy</span>
        <span class="bar-total" id="today-total">—</span>
        <button type="button" class="icon-button" id="open-notes" aria-label="Abrir las notas">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 1.9H4.3a1.2 1.2 0 0 0-1.2 1.2v9.8a1.2 1.2 0 0 0 1.2 1.2h7.4a1.2 1.2 0 0 0 1.2-1.2V5.9Z" />
            <path d="M9 1.9v4h3.9M5.6 8.6h4.8M5.6 11h3.2" />
          </svg>
        </button>
        <button type="button" class="icon-button" id="open-settings" aria-label="Ajustes">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
            <circle cx="8" cy="8" r="2.4" />
            <path d="M8 1.7v1.5M8 12.8v1.5M14.3 8h-1.5M3.2 8H1.7M12.4 3.6l-1 1M4.6 11.4l-1 1M12.4 12.4l-1-1M4.6 4.6l-1-1" />
          </svg>
        </button>
      </header>

      <nav class="tabs" role="tablist" aria-label="Secciones">
        <button type="button" role="tab" data-tab="ahora" aria-selected="true">Ahora</button>
        <button type="button" role="tab" data-tab="hoy" aria-selected="false">Hoy</button>
        <button type="button" role="tab" data-tab="jira" aria-selected="false">Jira</button>
        <button type="button" role="tab" data-tab="repos" aria-selected="false">Repos</button>
      </nav>

      <main class="view" id="view"></main>

      <footer class="launcher" id="launcher">
        <form class="launcher-row" id="launch-form">
          <label class="visually-hidden" for="launch-title">Título del cronómetro</label>
          <input
            id="launch-title"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="¿En qué trabajas?"
          />
          <button type="submit" class="go" aria-label="Arrancar">
            <svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3.6 2.4 9.4 6 3.6 9.6Z" fill="currentColor" />
            </svg>
          </button>
        </form>
        <button type="button" class="quiet-link" id="launch-blank">o arranca en blanco</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
